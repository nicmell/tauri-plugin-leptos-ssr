[workspace]
resolver = "3"
members = ["app", "frontend", "server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
app = { path = "app" }
tauri-plugin-leptos-ssr = { path = "../.." }

leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
leptos_axum = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

tauri = "2.12"
tauri-build = { version = "2.7", default-features = false }
tauri-plugin-log = "2.10"
log = "0.4"
serde_json = "1"
toml = "1"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "tauri-app"
bin-package = "server"
lib-package = "frontend"
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
# cargo-leptos dev builds compile leptos with other flags than the Tauri
# build; separate target dirs keep them from rebuilding each other.
bin-target-dir = "target/server"
