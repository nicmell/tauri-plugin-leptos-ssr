[package]
name = "tauri-plugin-leptos-ssr"
version = "0.1.0"
authors = [ "You" ]
description = "Serve a cargo-leptos SSR app inside a Tauri app through a custom URI scheme"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples"]
links = "tauri-plugin-leptos-ssr"

[dependencies]
tauri = { version = "2.12" }
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["time"] }
leptos_config = "0.8"
percent-encoding = "2"
url = "2"
log = "0.4"
serde = "1.0"
thiserror = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
