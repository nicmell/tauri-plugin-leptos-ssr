[package]
name = "tauri-plugin-leptos-ssr"
version = "0.3.1"
description = "Serve a cargo-leptos SSR app inside a Tauri app through a custom URI scheme"
edition = "2024"
rust-version = "1.90"
license = "MIT-0"
repository = "https://github.com/nicmell/tauri-plugin-leptos-ssr"
exclude = ["/examples"]
links = "tauri-plugin-leptos-ssr"

[dependencies]
tauri = { version = "2.12" }
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "service", "tokio"] }
http-body-util = "0.1.5"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
leptos_config = "0.8"
percent-encoding = "2"
url = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
http-body = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
